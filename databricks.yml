# This is a Databricks asset bundle definition for dapsample.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dapsample
  uuid: b70eccc4-5f4c-4b40-99c2-01c5f388a7ae

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-0aabb1f9-d628.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-0aabb1f9-d628.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/itspopuri@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/itspopuri@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: itspopuri@gmail.com
        level: CAN_MANAGE
